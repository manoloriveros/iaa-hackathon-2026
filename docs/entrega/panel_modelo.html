.g-svg { display: block; max-width: 100%; height: auto; font-family: var(--fuente); overflow: visible; }
.g-svg text { fill: var(--text-secondary); font-size: 11px; }
.g-svg .g-tick { fill: var(--text-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.g-svg .g-cat { fill: var(--text-primary); font-size: 11px; }
.g-svg .g-val { fill: var(--text-primary); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.g-svg .g-seg { fill: #ffffff; font-size: 10px; font-weight: 600; }
.g-svg .g-ley { fill: var(--text-secondary); font-size: 11px; }
.g-svg .g-ytit, .g-svg .g-xtit { fill: var(--text-muted); font-size: 10.5px; }
.g-svg .g-nota { fill: var(--text-secondary); font-size: 10.5px; }
.g-svg .g-banda { fill: var(--text-muted); font-size: 10px; letter-spacing: .02em; }
.g-svg .g-fuerte { fill: var(--text-primary); font-weight: 650; }
.g-svg .g-barra:focus { outline: none; filter: brightness(1.08); }
.g-svg .g-barra:hover { filter: brightness(1.08); }

.g-tooltip { position: fixed; z-index: 50; display: none; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: 12px/1.45 var(--fuente);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .12); max-width: 280px; }
.g-tip-t { color: var(--text-secondary); margin-bottom: 4px; }
.g-tip-f { display: flex; align-items: center; gap: 7px; }
.g-tip-k { width: 12px; height: 2.5px; border-radius: 2px; display: inline-block; }
.g-tip-n { color: var(--text-secondary); }
.g-tabla { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.g-tabla th, .g-tabla td { padding: 6px 9px; border-bottom: 1px solid var(--grid); text-align: left; }
.g-tabla th { color: var(--text-secondary); font-weight: 600; }
.g-tabla td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Diagramas: trazo en currentColor, un solo color con significado. */
.d-svg { display: block; max-width: 100%; height: auto; font-family: var(--fuente); color: var(--text-primary); }
.d-svg text { fill: currentColor; font-size: 11.5px; }
.d-svg .d-t { font-weight: 650; font-size: 12px; }
.d-svg .d-s { fill: var(--text-secondary); font-size: 10.5px; }
.d-svg .d-m { fill: var(--text-muted); font-size: 10px; }
.d-svg .d-flecha { stroke: var(--text-muted); stroke-width: 1.4; fill: none; }
.d-svg .d-caja { fill: var(--surface-1); stroke: var(--axis); stroke-width: 1; }
.d-svg .d-caja-acento { fill: var(--brand-soft); stroke: var(--brand); stroke-width: 1.4; }
.d-svg .d-caja-ia { fill: rgba(42, 120, 214, .07); stroke: var(--acento); stroke-width: 1.2; }
.d-svg .d-caja-control { fill: rgba(235, 104, 52, .07); stroke: var(--acento-2); stroke-width: 1.2; }
.d-svg .d-etq { fill: var(--text-secondary); font-size: 10px; font-style: italic; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text-primary);font:15px/1.55 var(--fuente)}
a{color:var(--brand)}
.marco{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface-1);border-right:1px solid var(--border);padding:22px 18px}
aside .kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
aside h1{font-size:20px;line-height:1.25;margin:8px 0 6px;color:var(--brand)}
aside p{font-size:12.5px;color:var(--text-secondary);margin:0 0 14px}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--text-primary);text-decoration:none;font-size:14px}
nav a:hover,nav a:focus-visible{background:var(--brand-soft)}
.conmutadores{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
.conmutadores button{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:6px;padding:5px 10px;cursor:pointer}
.conmutadores button[aria-pressed="true"]{background:var(--brand);color:var(--surface-1);border-color:var(--brand)}
main{padding:28px clamp(16px,3vw,44px) 60px;max-width:1240px}
section{scroll-margin-top:16px;margin:0 0 34px}
h2{font-size:24px;line-height:1.25;margin:0 0 8px;color:var(--brand)}
h3{font-size:16px;margin:18px 0 6px}
p{max-width:95ch;margin:6px 0 12px}
.lead{font-size:16px;color:var(--text-secondary);max-width:90ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0 18px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-top:3px solid var(--brand);border-radius:8px;padding:12px 14px}
.kpi .v{font-size:28px;font-weight:650;line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--text-secondary);margin-top:4px}
.tarjeta{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.tarjeta figcaption{font-size:13px;color:var(--text-secondary);margin-top:8px}
.tarjeta .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.tarjeta .cab strong{font-size:14.5px}
.tarjeta button.vt{font:inherit;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);border-radius:6px;padding:3px 9px;cursor:pointer}
.tarjeta .vista{overflow-x:auto}
.tarjeta .tabla{display:none;margin-top:8px;overflow-x:auto}
.tarjeta.con-tabla .tabla{display:block}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.g-par,.g-tres{display:flex;gap:10px;flex-wrap:wrap}
.g-par>div,.g-tres>div{flex:1 1 220px;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface-1)}
table.t th,table.t td{border-bottom:1px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{color:var(--text-secondary);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vista.ancha svg.g-svg,.vista.ancha svg.d-svg{width:100%;height:auto}
.vista svg{margin:0 auto}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.estado i{width:9px;height:9px;border-radius:50%;display:inline-block}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.filtros button{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:6px;padding:4px 10px;cursor:pointer}
.filtros button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
code{font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--brand-soft);padding:1px 5px;border-radius:4px}
pre{font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto}
footer{color:var(--text-muted);font-size:12px;border-top:1px solid var(--border);padding-top:14px;margin-top:30px}
@media (max-width:900px){.marco{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}nav{display:flex;flex-wrap:wrap;gap:4px}nav a{padding:5px 8px}}
@media print{aside,.conmutadores,button.vt{display:none}.marco{display:block}main{max-width:none}.tarjeta{break-inside:avoid}}

    en: {
      kicker: 'IAA AI Hackathon 2026 · Part 1', titulo: 'Per-peril blend: final model dashboard', claro: 'Light', oscuro: 'Dark',

      resumen_lead: 'This dashboard walks through the delivered model with the same numbers as the report. The final submission, S41, is the Per-peril blend with its 2025 level calibrated by three factors, one per line, under a credibility rule fixed before looking (section 2025 level). Every chart has a table, and every figure comes from docs/entrega/datos/cifras_entregables.json, which stores the path and SHA-256 of each source.',

      nivel_lead: 'The final submission, S41, is the Per-peril blend with each line\'s 2025 level multiplied by one factor: {fM} in motor, {fB} in buildings and {fC} in contents. It is a three-parameter calibration of the level: nothing was retrained, and within each line every period keeps its rank and relativities. Each factor weighs two estimates of the line\'s level: the blend\'s own, from 2023 and 2024, and the one implied by the public leaderboard, computed on about a third of the test and the only measure of 2025 experience.',
      f_cal: 'With the Tweedie deviance at power 1.5, D²(c) − D²(1) = −4·[S1·(c^−½ − 1) + S2·(c^½ − 1)]/N: two probes per line (×0.90 and ×1.10) fix the curve and its maximum, c* = S1/S2. Dots: scores returned by Kaggle; hollow circle: public optimum; filled circle and dashed line: the S41 factor. The probes were diagnostic and excluded from the selection.',
      t_sondas: ['Line', 'Probe ×0.90', 'Probe ×1.10', 'Optimum c*', 'Noise σ of c*'],
      nivel_regla_t: 'A rule fixed before looking',
      nivel_regla: 'The public optimum is noisy: applying it in full gained {g33} on the third of 2024 where it was measured and lost {p67} on average on the other two. So before the probes were scored we fixed c = 1 + Z·(c* − 1), with Z = τ²/(τ² + σ²), σ the noise of the optimum over 300 thirds of 2024 and τ the uncertainty of our own level. S41 is that rule applied without changes: it scored {p41}, what the closed form predicted to the fifth decimal, and rounding leaves c* within ±{rd0} to ±{rd1}. The optima deviated from 1 more than the prior allowed (chi-square {chi2} on 3 degrees of freedom, p ≈ {pv}): the leaderboard asks for larger corrections, and S41 applies only the credible part.',

      nivel_evid_t: 'Actuarial evidence without the leaderboard',
      nivel_evid_lead: 'Each factor was set against three indicators that do not use the leaderboard, with the criterion the sensitivity battery wrote down before computing, applied here, after the fact, to S41\'s adjustments: a line is supported when at least two indicators agree in sign with the adjustment and it stays within the largest of them plus τ; partial with one, or with two or more and the size outside; unsupported with none. Indicators: (a) the last year, f24/f − 1; (b) the label effects of the reserve analysis; (c) keeping the 2024 loss ratio, estimated ultimate cost over written premium, in 2025, a pricing assumption rather than an observed cost. The data dictionary does not say whether the premium is an annual rate or the amount for the period (open finding DATA-006): in brackets, (c) with the premium read as an annual rate; every line reads the same under both. They are independent of the leaderboard, not of the project\'s data and assumptions, and they do not replace professional validation.',
      t_evid: ['Line', 'S41 adjustment', '(a) Last year', '(b) Label effects', '(c) 2024 loss ratio', 'Reading'],

      sens_t: 'Why S41', sens_lead: 'A sensitivity battery, pre-registered once the scores were known, found that the noise of the public optimum had been measured against the whole of 2024, which contains the sample; against the unseen two thirds it is {coc} times larger. With that correction it recomputed the expected private-set gain over the blend under three pairs of priors (table): S41 is the only calibrated file ahead of the blend under all three. Two later calibrations of the same leaderboard, a revised credibility and a shape exponent per line, scored more in public ({p42} and {p43}) but lean further on it; their expectations are lower on average, and the plan\'s alarm rules fired in favour of S41 against both ({al42} and {alarma}, threshold {umb}). Outside the leaderboard, the 2023 and 2024 optima also ask to widen the motor shape, not to compress it. The lead is small against the noise: the shape calibration still beats S41 with probability {pmin} to {pmaxp}.', t_sens: ['File', 'Rules fixed before the probes', 'Corrected empirical Bayes', 'Priors without the leaderboard'], filas_sens: { S41: 'S41, the final submission', S42: 'Revised credibility, tested and not selected', S43: 'Shape exponent per line, tested and not selected' },
      nivel_eleccion: 'The participant selected S41 in Kaggle on 23 October, before the close of part 1. The bodily injury severity check, computed before the probes, put the blend\'s motor level {s3a} high; with S41\'s rule, S41\'s would be {s3c} high ({s3d} to {s3e}), so if that check is right most of the gap remains. S3 was not adopted.',
