*{box-sizing:border-box}

.g-par,.g-tres{display:flex;gap:10px;flex-wrap:wrap}

code{font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--brand-soft);padding:1px 5px;border-radius:4px}

      resumen_lead: 'This dashboard walks through the delivered model with the same numbers as the report. The final submission, S41, is the Per-peril blend with its 2025 level calibrated by three factors, one per line, under a credibility rule fixed before looking (section 2025 level). Every chart has a table, and every figure comes from docs/entrega/datos/cifras_entregables.json, which stores the path and SHA-256 of each source.',

      nivel_lead: 'The final submission, S41, is the Per-peril blend with each line\'s 2025 level multiplied by one factor: {fM} in motor, {fB} in buildings and {fC} in contents. It is a three-parameter calibration of the level: nothing was retrained, and within each line every period keeps its rank and relativities. Each factor weighs two estimates of the line\'s level: the blend\'s own, from 2023 and 2024, and the one implied by the public leaderboard, computed on about a third of the test and the only measure of 2025 experience.',
      f_cal: 'With the Tweedie deviance at power 1.5, D²(c) − D²(1) = −4·[S1·(c^−½ − 1) + S2·(c^½ − 1)]/N: two probes per line (×0.90 and ×1.10) fix the curve and its maximum, c* = S1/S2. Dots: scores returned by Kaggle; hollow circle: public optimum; filled circle and dashed line: the S41 factor. The probes were diagnostic and excluded from the selection.',
      t_sondas: ['Line', 'Probe ×0.90', 'Probe ×1.10', 'Optimum c*', 'Noise σ of c*'],
      nivel_regla_t: 'A rule fixed before looking',
      nivel_regla: 'The public optimum is noisy: applying it in full gained {g33} on the third of 2024 where it was measured and lost {p67} on average on the other two. So before the probes were scored we fixed c = 1 + Z·(c* − 1), with Z = τ²/(τ² + σ²), σ the noise of the optimum over 300 thirds of 2024 and τ the uncertainty of our own level. S41 is that rule applied without changes: it scored {p41}, what the closed form predicted to the fifth decimal, and rounding leaves c* within ±{rd0} to ±{rd1}. The optima deviated from 1 more than the prior allowed (chi-square {chi2} on 3 degrees of freedom, p ≈ {pv}): the leaderboard asks for larger corrections, and S41 applies only the credible part.',
      t_cred: ['Line', 'Prior τ', 'Prior Z', 'S41 factor', 'Final f × c', 'Z with the corrected noise', 'Share of a reserve error it keeps'], hip_t: 'What S41 assumes', t_hip: ['Assumption', 'How it was checked', 'If it fails'], hip: [['The blend ranks and spreads risk well in 2025', 'D² {d24} out of sample on 2024, and every decile of predicted cost follows the observed one', 'The factors only correct the level'], ['The public score is the deviance on a random third', 'Scores fit the closed form to five decimals, which does not identify the scorer', 'Only 15% to 35% of the public deviation is applied'], ['A third of 2024 sizes the noise of the public optimum', 'Later measured {coc} times larger against the unseen two thirds', 'S41 applies slightly more than it should; its expected gain stays positive'], ['Our level is right within τ', 'The deviations were wider than τ allowed (p ≈ {pv})', 'S41 stays closer to the blend\'s level than the leaderboard asks'], ['Case reserves at 31-12-2024 are adequate', 'One valuation cannot prove it', 'A {r41a} error in motor reserves moves S41\'s level by 1%; material in all three lines']],
      nivel_evid_t: 'Actuarial evidence without the leaderboard',
      nivel_evid_lead: 'Each factor was set against three indicators that do not use the leaderboard, with the criterion the sensitivity battery wrote down before computing, applied here, after the fact, to S41\'s adjustments: a line is supported when at least two indicators agree in sign with the adjustment and it stays within the largest of them plus τ; partial with one, or with two or more and the size outside; unsupported with none. Indicators: (a) the last year, f24/f − 1; (b) the label effects of the reserve analysis; (c) keeping the 2024 loss ratio, estimated ultimate cost over written premium, in 2025, a pricing assumption rather than an observed cost. The data dictionary does not say whether the premium is an annual rate or the amount for the period (open finding DATA-006): in brackets, (c) with the premium read as an annual rate; every line reads the same under both. They are independent of the leaderboard, not of the project\'s data and assumptions, and they do not replace professional validation.',
      t_evid: ['Line', 'S41 adjustment', '(a) Last year', '(b) Label effects', '(c) 2024 loss ratio', 'Reading'],
      clases: { apoyado: 'Supported', parcial: 'Partial', sin_apoyo: 'Unsupported', por_tamano: 'Partial, by size' }, si_prima: ' if the premium is annual', puntos: ' points', no_hay: 'none',
      sens_t: 'Why S41', sens_lead: 'A sensitivity battery, pre-registered once the scores were known, found that the noise of the public optimum had been measured against the whole of 2024, which contains the sample; against the unseen two thirds it is {coc} times larger. With that correction it recomputed the expected private-set gain over the blend under three pairs of priors (table): S41 is the only calibrated file ahead of the blend under all three. Two later calibrations of the same leaderboard, a revised credibility and a shape exponent per line, scored more in public ({p42} and {p43}) but lean further on it; their expectations are lower on average, and the plan\'s alarm rules fired in favour of S41 against both ({al42} and {alarma}, threshold {umb}). Outside the leaderboard, the 2023 and 2024 optima also ask to widen the motor shape, not to compress it. The lead is small against the noise: the shape calibration still beats S41 with probability {pmin} to {pmaxp}.', t_sens: ['File', 'Rules fixed before the probes', 'Corrected empirical Bayes', 'Priors without the leaderboard'], filas_sens: { S41: 'S41, the final submission', S42: 'Revised credibility, tested and not selected', S43: 'Shape exponent per line, tested and not selected' },
